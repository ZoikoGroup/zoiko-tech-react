name: Deploy to GCP VM

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          # Default command_timeout is 10m; `next build` on the VM takes longer.
          timeout: 60s
          command_timeout: 30m
          script: |
            set -e
            cd /var/www/zoiko-tech/app
            git pull origin main
            npm ci
            npm run build
            pm2 restart zoiko-tech
            pm2 save
